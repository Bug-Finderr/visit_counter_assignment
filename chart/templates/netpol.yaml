# nothing is allowed unless a policy below allows it
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: visit-counter
spec:
  podSelector:
    matchLabels:
      app: visit-counter
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # users and the prometheus scrape both come in on port 8000
    - ports:
        - port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: visit-counter-redis
      ports:
        - port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if .Values.tracing.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: jaeger
      ports:
        - port: 4318
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: visit-counter-redis
spec:
  podSelector:
    matchLabels:
      app: visit-counter-redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: visit-counter
      ports:
        - port: 6379
