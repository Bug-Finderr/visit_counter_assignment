apiVersion: v1
kind: ConfigMap
metadata:
  name: visit-counter-config
data:
  REDIS_NODES: "{{ range $i, $_ := until (int .Values.redis.shards) }}{{ if $i }},{{ end }}redis://visit-counter-redis-{{ $i }}.visit-counter-redis:6379{{ end }}"
  DEBUG: "false"
  {{- if .Values.tracing.enabled }}
  OTEL_TRACES_EXPORTER: otlp_proto_http
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.tracing.endpoint }}
  OTEL_SERVICE_NAME: visit-counter
  {{- end }}
