services:
  app:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - REDIS_NODES=redis://redis1:6379,redis://redis2:6379
      - DEBUG=true
    depends_on:
      - redis1
      - redis2

  redis1:
    image: redis:7
    ports:
      - "7070:6379"
    volumes:
      - redis1_data:/data
    command: redis-server --appendonly yes

  redis2:
    image: redis:7
    ports:
      - "7071:6379"
    volumes:
      - redis2_data:/data
    command: redis-server --appendonly yes

volumes:
  redis1_data:
  redis2_data:
